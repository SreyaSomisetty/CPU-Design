<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="410" y="34" font-size="22" font-weight="bold" text-anchor="middle">SAP-8 CPU Block Diagram</text>
  <text x="410" y="56" font-size="13" text-anchor="middle" fill="#555">8-bit accumulator architecture</text>

  <!-- ===================== CPU boundary ===================== -->
  <rect x="40" y="80" width="470" height="440" rx="10" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="55" y="102" font-size="13" font-weight="bold" fill="#333">CPU</text>

  <!-- Control Unit -->
  <rect x="70" y="120" width="180" height="70" rx="6" fill="#e8eefc" stroke="#2b4b8a" stroke-width="2"/>
  <text x="160" y="150" font-size="15" font-weight="bold" text-anchor="middle">Control Unit</text>
  <text x="160" y="172" font-size="11" text-anchor="middle" fill="#444">decode + sequencing</text>

  <!-- Instruction Register -->
  <rect x="300" y="120" width="180" height="70" rx="6" fill="#e8eefc" stroke="#2b4b8a" stroke-width="2"/>
  <text x="390" y="150" font-size="15" font-weight="bold" text-anchor="middle">Instruction Reg (IR)</text>
  <text x="390" y="172" font-size="11" text-anchor="middle" fill="#444">holds current opcode</text>

  <!-- Program Counter -->
  <rect x="70" y="220" width="180" height="60" rx="6" fill="#eafaf0" stroke="#1f7a46" stroke-width="2"/>
  <text x="160" y="248" font-size="15" font-weight="bold" text-anchor="middle">PC</text>
  <text x="160" y="268" font-size="11" text-anchor="middle" fill="#444">program counter (8-bit)</text>

  <!-- Accumulator A -->
  <rect x="300" y="220" width="180" height="60" rx="6" fill="#fff3e0" stroke="#b5691f" stroke-width="2"/>
  <text x="390" y="248" font-size="15" font-weight="bold" text-anchor="middle">A  (Accumulator)</text>
  <text x="390" y="268" font-size="11" text-anchor="middle" fill="#444">8-bit</text>

  <!-- Register B -->
  <rect x="300" y="300" width="180" height="60" rx="6" fill="#fff3e0" stroke="#b5691f" stroke-width="2"/>
  <text x="390" y="328" font-size="15" font-weight="bold" text-anchor="middle">B  (Temp Reg)</text>
  <text x="390" y="348" font-size="11" text-anchor="middle" fill="#444">8-bit</text>

  <!-- ALU -->
  <polygon points="70,300 250,300 230,360 90,360" fill="#fde8ec" stroke="#a5223c" stroke-width="2"/>
  <text x="160" y="330" font-size="15" font-weight="bold" text-anchor="middle">ALU</text>
  <text x="160" y="348" font-size="11" text-anchor="middle" fill="#444">ADD SUB MUL INR DCR</text>

  <!-- Z flag -->
  <rect x="70" y="400" width="110" height="46" rx="6" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
  <text x="125" y="422" font-size="14" font-weight="bold" text-anchor="middle">Z flag</text>
  <text x="125" y="438" font-size="10" text-anchor="middle" fill="#444">zero</text>

  <!-- ===================== RAM ===================== -->
  <rect x="600" y="140" width="180" height="300" rx="8" fill="#eef3ee" stroke="#444" stroke-width="2"/>
  <text x="690" y="166" font-size="16" font-weight="bold" text-anchor="middle">RAM</text>
  <text x="690" y="186" font-size="11" text-anchor="middle" fill="#444">256 bytes</text>
  <text x="690" y="202" font-size="11" text-anchor="middle" fill="#444">0x00 .. 0xFF</text>
  <line x1="615" y1="214" x2="765" y2="214" stroke="#999" stroke-width="1"/>
  <text x="690" y="236" font-size="12" text-anchor="middle">0x00-0x3F : code</text>
  <text x="690" y="258" font-size="12" text-anchor="middle">0x40-0xFF : data</text>
  <rect x="620" y="290" width="140" height="130" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  <text x="690" y="312" font-size="11" text-anchor="middle" fill="#666">memory</text>
  <text x="690" y="330" font-size="11" text-anchor="middle" fill="#666">cells</text>
  <text x="690" y="348" font-size="11" text-anchor="middle" fill="#666">(bytes)</text>

  <!-- ===================== BUS ===================== -->
  <rect x="520" y="110" width="26" height="420" fill="#d9d9d9" stroke="#888" stroke-width="1"/>
  <text x="533" y="125" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(90 533 300)">8-bit DATA / ADDRESS BUS</text>

  <!-- Connections CPU <-> bus -->
  <line x1="480" y1="155" x2="520" y2="155" stroke="#2b4b8a" stroke-width="2"/>
  <line x1="250" y1="250" x2="520" y2="250" stroke="#1f7a46" stroke-width="2"/>
  <line x1="480" y1="250" x2="520" y2="250" stroke="#b5691f" stroke-width="2"/>
  <line x1="480" y1="330" x2="520" y2="330" stroke="#b5691f" stroke-width="2"/>

  <!-- bus <-> RAM -->
  <line x1="546" y1="250" x2="600" y2="250" stroke="#444" stroke-width="3"/>
  <polygon points="600,250 590,245 590,255" fill="#444"/>
  <polygon points="546,250 556,245 556,255" fill="#444"/>

  <!-- internal CPU arrows -->
  <!-- IR -> Control -->
  <line x1="300" y1="155" x2="250" y2="155" stroke="#2b4b8a" stroke-width="2"/>
  <polygon points="250,155 260,150 260,160" fill="#2b4b8a"/>
  <!-- A -> ALU -->
  <line x1="300" y1="250" x2="255" y2="320" stroke="#a5223c" stroke-width="2"/>
  <polygon points="255,320 265,316 262,326" fill="#a5223c"/>
  <!-- B -> ALU -->
  <line x1="300" y1="330" x2="250" y2="330" stroke="#a5223c" stroke-width="2"/>
  <polygon points="250,330 260,325 260,335" fill="#a5223c"/>
  <!-- ALU -> A (result) -->
  <line x1="200" y1="300" x2="340" y2="282" stroke="#a5223c" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="340,282 329,282 334,291" fill="#a5223c"/>
  <!-- ALU -> Z -->
  <line x1="130" y1="360" x2="125" y2="400" stroke="#666" stroke-width="2"/>
  <polygon points="125,400 120,391 130,391" fill="#666"/>

  <!-- Legend -->
  <text x="40" y="548" font-size="11" fill="#555">Figure 1. SAP-8 datapath: registers A/B/PC, ALU with Z flag, control unit, and a shared 8-bit bus to 256-byte RAM.</text>
</svg>
