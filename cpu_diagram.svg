<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 760 460" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7D7D7D"/></marker>
  </defs>
  <rect x="0" y="30" width="760" height="460" fill="#fff"/>

  <!-- buses -->
  <line x1="28" y1="130" x2="570" y2="130" stroke="#7D7D7D" stroke-width="6" marker-end="url(#ahg)"/>
  <text x="330" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">ADDRESS BUS (8 bits)</text>
  <line x1="40" y1="300" x2="570" y2="300" stroke="#7D7D7D" stroke-width="6" marker-start="url(#ahg)" marker-end="url(#ahg)"/>
  <text x="300" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">DATA BUS (8 bits)</text>

  <!-- RAM -->
  <rect x="580" y="70" width="150" height="330" rx="6" fill="#EDEDED" stroke="#111" stroke-width="1.5"/>
  <text x="655" y="96" text-anchor="middle" font-size="15" font-weight="bold">RAM</text>
  <text x="655" y="112" text-anchor="middle" font-size="10">256 x 8 bits</text>
  <rect x="600" y="150" width="110" height="60" fill="#DCE9F7" stroke="#111"/>
  <text x="655" y="176" text-anchor="middle" font-size="11" font-weight="bold">CODE</text>
  <text x="655" y="192" text-anchor="middle" font-size="10">0x00 - 0x3F</text>
  <rect x="600" y="215" width="110" height="70" fill="#FFF3B8" stroke="#111"/>
  <text x="655" y="243" text-anchor="middle" font-size="11" font-weight="bold">DATA</text>
  <text x="655" y="259" text-anchor="middle" font-size="10">0x40 - 0xFF</text>
  <text x="584" y="126" font-size="9" font-weight="bold">ADDR</text>
  <text x="584" y="296" font-size="9" font-weight="bold">DATA</text>

  <!-- PC -->
  <rect x="40" y="44" width="120" height="52" rx="5" fill="#DCE9F7" stroke="#111" stroke-width="1.5"/>
  <text x="100" y="68" text-anchor="middle" font-size="13" font-weight="bold">PC</text>
  <text x="100" y="84" text-anchor="middle" font-size="9">program counter (8 bit)</text>
  <line x1="100" y1="96" x2="100" y2="130" stroke="#111" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="108" y="116" font-size="9">PC &lt;-&gt; addr (fetch / jump)</text>
  <text x="168" y="40" font-size="9">PC &lt;- PC + 1  (+ 2 if instruction has an operand)</text>

  <!-- instruction registers -->
  <rect x="40" y="160" width="120" height="118" rx="5" fill="#EAF1FA" stroke="#111" stroke-width="1.5"/>
  <rect x="48" y="168" width="104" height="44" rx="3" fill="#DCE9F7" stroke="#111"/>
  <text x="100" y="186" text-anchor="middle" font-size="12" font-weight="bold">IR</text>
  <text x="100" y="202" text-anchor="middle" font-size="9">opcode byte</text>
  <rect x="48" y="222" width="104" height="48" rx="3" fill="#DCE9F7" stroke="#111"/>
  <text x="100" y="240" text-anchor="middle" font-size="12" font-weight="bold">OPR</text>
  <text x="100" y="256" text-anchor="middle" font-size="9">operand (addr / imm)</text>
  <line x1="100" y1="300" x2="100" y2="278" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="108" y="292" font-size="9">fetched bytes</text>
  <path d="M 40 246 L 28 246 L 28 130" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="20" y="200" font-size="9" transform="rotate(-90 20 200)" text-anchor="middle">operand -&gt; addr</text>

  <!-- control unit -->
  <rect x="230" y="160" width="170" height="108" rx="6" fill="#FDE3BF" stroke="#111" stroke-width="1.5"/>
  <text x="315" y="204" text-anchor="middle" font-size="13" font-weight="bold">CONTROL UNIT</text>
  <text x="315" y="220" text-anchor="middle" font-size="9">decode opcode</text>
  <text x="315" y="233" text-anchor="middle" font-size="9">fetch -&gt; decode -&gt; execute</text>
  <line x1="152" y1="190" x2="230" y2="190" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="191" y="184" text-anchor="middle" font-size="9">opcode</text>

  <!-- Z flag -->
  <rect x="440" y="150" width="70" height="44" rx="5" fill="#F6D5D5" stroke="#111" stroke-width="1.5"/>
  <text x="475" y="170" text-anchor="middle" font-size="13" font-weight="bold">Z</text>
  <text x="475" y="185" text-anchor="middle" font-size="9">zero flag</text>
  <line x1="440" y1="172" x2="400" y2="172" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="420" y="166" text-anchor="middle" font-size="9">Z</text>

  <!-- control signals (red dashed) -->
  <path d="M 340 160 L 340 70 L 160 70" fill="none" stroke="#C0392B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ahr)"/>
  <text x="250" y="64" text-anchor="middle" font-size="9" fill="#C0392B">load / inc</text>
  <path d="M 400 245 L 580 245" fill="none" stroke="#C0392B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ahr)"/>
  <text x="530" y="239" text-anchor="middle" font-size="9" fill="#C0392B">RD / WR</text>
  <path d="M 370 268 L 370 350" fill="none" stroke="#C0392B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ahr)"/>
  <text x="300" y="342" font-size="9" fill="#C0392B">ALU op, load A</text>

  <!-- A register -->
  <rect x="40" y="350" width="120" height="52" rx="5" fill="#DCE9F7" stroke="#111" stroke-width="1.5"/>
  <text x="100" y="373" text-anchor="middle" font-size="13" font-weight="bold">A</text>
  <text x="100" y="389" text-anchor="middle" font-size="9">accumulator (8 bit)</text>
  <line x1="70" y1="350" x2="70" y2="300" stroke="#111" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="76" y="334" font-size="9">LDA / STA</text>

  <!-- ALU -->
  <rect x="360" y="350" width="150" height="52" rx="5" fill="#DDF0D0" stroke="#111" stroke-width="1.5"/>
  <text x="435" y="372" text-anchor="middle" font-size="13" font-weight="bold">ALU</text>
  <text x="435" y="388" text-anchor="middle" font-size="9">ADD  SUB  MUL  INR  DCR</text>
  <line x1="160" y1="364" x2="360" y2="364" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="260" y="360" text-anchor="middle" font-size="9">A (input)</text>
  <line x1="360" y1="390" x2="160" y2="390" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="260" y="404" text-anchor="middle" font-size="9">result -&gt; A</text>
  <line x1="410" y1="300" x2="410" y2="350" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="416" y="330" font-size="9">RAM[addr]</text>
  <line x1="480" y1="350" x2="480" y2="194" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="486" y="334" font-size="9">A == 0 ?</text>

  <!-- B register -->
  <rect x="190" y="425" width="110" height="42" rx="5" fill="#DCE9F7" stroke="#111" stroke-width="1.5"/>
  <text x="245" y="443" text-anchor="middle" font-size="13" font-weight="bold">B</text>
  <text x="245" y="458" text-anchor="middle" font-size="9">temp (8 bit)</text>
  <path d="M 90 402 L 90 438 L 190 438" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="140" y="432" text-anchor="middle" font-size="9">MOV_AB</text>
  <path d="M 190 456 L 120 456 L 120 402" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="152" y="470" text-anchor="middle" font-size="9">MOV_BA</text>

  <!-- legend -->
  <line x1="560" y1="430" x2="590" y2="430" stroke="#7D7D7D" stroke-width="5"/>
  <text x="596" y="433" font-size="9">bus</text>
  <line x1="630" y1="430" x2="660" y2="430" stroke="#C0392B" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="666" y="433" font-size="9">control signal</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
